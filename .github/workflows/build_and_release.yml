name: Build and Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Release Name'
        required: false
        default: 'Release v1.0.0'

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            output_name: flutter_radio-linux-x64.tar.gz
          - os: windows-latest
            platform: windows
            output_name: flutter_radio-windows-x64.zip
          - os: macos-latest
            platform: macos
            output_name: flutter_radio-macos-arm64.zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: 3.44.0
          cache: true

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: |
          flutter build linux --release
          # Package the bundle
          cd build/linux/x64/release/bundle
          tar -czf ../../../../../${{ matrix.output_name }} .

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          flutter build windows --release
          # Package the release files
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ${{ matrix.output_name }}

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        env:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          flutter build macos --release
          cd "build/macos/Build/Products/Release"
          zip -r "../../../../${{ matrix.output_name }}" "flutter_radio.app"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-artifact
          path: ${{ matrix.output_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name || github.event.inputs.tag_name }}
          files: artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
